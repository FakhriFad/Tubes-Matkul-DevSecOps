# ============================================================
# CD Pipeline — deploy to production on merge to main
#
# Requires these repository secrets:
#   DEPLOY_HOST        – SSH host (IP or domain)
#   DEPLOY_USER        – SSH username
#   DEPLOY_SSH_KEY     – Private SSH key (PEM format)
#   DEPLOY_PATH        – Absolute path on server (e.g. /opt/ecommerce)
#   POSTGRES_PASSWORD  – Production DB password
#   REDIS_PASSWORD     – Production Redis password
#   JWT_SECRET         – Production JWT secret (≥64 chars)
#   CORS_ORIGIN        – Production frontend origin (e.g. https://myshop.com)
#   NEXT_PUBLIC_API_URL – e.g. https://myshop.com/api
# ============================================================

name: CD — Deploy to Production

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production   # requires manual approval in GitHub Environments settings
    concurrency:
      group: production-deploy
      cancel-in-progress: false   # never cancel a running deploy

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Prepare deployment bundle ────────────────────────────────────────────
      - name: Create production .env
        run: |
          cat > .env.production << EOF
          NODE_ENV=production
          POSTGRES_DB=ecommerce
          POSTGRES_USER=ecom_user
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          LOG_LEVEL=info
          EOF

      # ── Deploy via SSH ───────────────────────────────────────────────────────
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Copy files to server
        run: |
          scp -r \
            webapp/docker-compose.yml \
            .env.production \
            webapp/nginx/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Deploy on remote server
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'REMOTE'
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}

            echo "→ Copying production env..."
            cp .env.production .env

            echo "→ Pulling latest images..."
            docker compose pull

            echo "→ Running zero-downtime rolling update..."
            # Bring up new containers before removing old ones
            docker compose up -d --no-deps --scale backend=2 backend
            sleep 10

            # Check health before cutting over
            if curl -sf http://localhost:4000/health > /dev/null; then
              echo "  Health check passed"
            else
              echo "  ERROR: health check failed — aborting deploy"
              docker compose up -d --no-deps --scale backend=1 backend
              exit 1
            fi

            docker compose up -d --remove-orphans
            docker image prune -f

            echo "→ Deploy complete"
          REMOTE

      - name: Post-deploy smoke test
        run: |
          sleep 15
          HTTP=$(curl -sk -o /dev/null -w "%{http_code}" ${{ secrets.CORS_ORIGIN }}/health)
          if [ "$HTTP" = "200" ]; then
            echo "Smoke test passed: /health returned 200"
          else
            echo "ERROR: /health returned $HTTP after deploy"
            exit 1
          fi

      - name: Notify on success
        if: success()
        run: |
          echo "::notice::Deployed commit ${{ github.sha }} to production successfully"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Production deploy FAILED for commit ${{ github.sha }}"
