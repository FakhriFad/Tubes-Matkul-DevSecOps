# ============================================================
# CI Pipeline — GitHub Actions
# Runs on every push and pull request.
#
# Stages:
#    lint          ESLint on backend + frontend
#    scan          Scan secret using gitleaks
#    test          41 unit tests (node:test, no external deps)
#    sast          Custom SAST scanner (15 rules, OWASP-mapped)
#    sast-codeql   GitHub CodeQL deep semantic analysis
#    sast-semgrep  Semgrep OWASP rule sets
#    dep-audit     npm audit (known CVEs in dependencies)
#    build         Docker image build
#    integration   Full stack up + DAST + smoke stress test
#    image-scan    Trivy container image vulnerability scan
# ============================================================

name: CI — Lint · Test · SAST · Build · DAST

on:
  push:
    branches: ["**"]
    paths:
      - 'webapp/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'webapp/**'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  packages: write

env:
  NODE_VERSION: "20"
  NPM_CONFIG_LEGACY_PEER_DEPS: "true"

jobs:

  # ── 1. Lint ───────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install & lint backend
        working-directory: webapp/backend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run lint

      - name: Install & lint frontend
        working-directory: webapp/frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run lint
  # ── 2. Secret Scan & Unit Tests ───────────────────────────────────────────
  secret-scan:
    name: Secret Scan — Gitleaks
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: --commit=latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate stubs & run tests
        working-directory: webapp/backend
        run: |
          node tests/create-stubs.js
          node --test tests/*.test.js

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: webapp/backend/test-results/

  # ── 3. Custom SAST ────────────────────────────────────────────────────────
  sast-custom:
    name: SAST — Custom Scanner
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Run SAST scanner
        run: |
          mkdir -p sast-results
          python3 webapp/sast/scanner.py --project ./webapp --output sast-results/sast-report.html

      - name: Upload SAST HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-report
          path: sast-results/
          retention-days: 30

  # ── 4. CodeQL ─────────────────────────────────────────────────────────────
  sast-codeql:
    name: SAST — CodeQL
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript

  # ── 5. Semgrep ────────────────────────────────────────────────────────────
  sast-semgrep:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    needs: lint
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config "p/owasp-top-ten" \
            --config "p/nodejs" \
            --config "p/react" \
            --config "p/jwt" \
            --config "p/secrets" \
            --sarif --output semgrep.sarif \
            --severity ERROR --severity WARNING \
            --exclude "webapp/backend/node_modules" \
            --exclude "webapp/frontend/node_modules" \
            webapp/
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ── 6. Dependency Audit ───────────────────────────────────────────────────
  dep-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit backend
        working-directory: webapp/backend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm audit --audit-level=high

      - name: Audit frontend
        working-directory: webapp/frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm audit --audit-level=high

  # ── 7. Docker Build ───────────────────────────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test, sast-custom, sast-codeql, sast-semgrep, dep-audit, secret-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Downcase repository name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./webapp/backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ env.REPO_LOWER }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./webapp/frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ env.REPO_LOWER }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: NEXT_PUBLIC_API_URL=https://localhost/api

  # ── 8. Integration — DAST + Smoke Stress ─────────────────────────────────
  integration:
    name: Integration (DAST + Smoke)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Generate TLS certificate
        run: chmod +x webapp/nginx/generate-certs.sh && ./webapp/nginx/generate-certs.sh

      - name: Create CI environment
        run: |
          cat > webapp/.env << 'EOF'
          POSTGRES_DB=ecommerce_ci
          POSTGRES_USER=ecom_user
          POSTGRES_PASSWORD=ci_test_pass_temp_only
          REDIS_PASSWORD=ci_redis_pass_temp_only
          JWT_SECRET=ci_jwt_secret_64chars_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          ADMIN_EMAIL=test@shop.ci
          ADMIN_PASSWORD=TestPass@12345
          CORS_ORIGIN=https://localhost
          NEXT_PUBLIC_API_URL=https://localhost/api
          LOG_LEVEL=warn
          BRUTE_MAX_ATTEMPTS=50
          EOF

      - name: Start full stack
        run: docker compose -f webapp/docker-compose.yml up -d --build

      - name: Wait for healthy stack
        run: |
          for i in $(seq 1 24); do
            HEALTHY=$(docker compose -f webapp/docker-compose.yml ps --format json | python3 -c "
          import sys, json
          data = [json.loads(l) for l in sys.stdin if l.strip()]
          print(sum(1 for s in data if s.get('Health') == 'healthy'))
          " 2>/dev/null || echo 0)
            echo "Healthy services: $HEALTHY / 5 (attempt $i/24)"
            [ "$HEALTHY" -ge 4 ] && echo "Stack ready" && break
            sleep 5
          done

      - name: Run DAST
        run: |
          mkdir -p dast-results
          python3 webapp/dast/dast_runner.py \
            --base-url https://localhost \
            --output dast-results/dast-report.html || true

      - name: Run k6 smoke test
        run: |
          mkdir -p stress-results
          docker run --rm -i \
            --network ecommerce_public_net \
            -e SCENARIO=smoke \
            -e BASE_URL=https://nginx \
            -v "$(pwd)/webapp/stress-tests:/tests" \
            grafana/k6 run --insecure-skip-tls-verify \
              /tests/k6-tests.js \
            2>&1 | tee stress-results/smoke.txt || true

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose -f webapp/docker-compose.yml logs backend  > dast-results/backend.log  2>&1 || true
          docker compose -f webapp/docker-compose.yml logs frontend > dast-results/frontend.log 2>&1 || true
          docker compose -f webapp/docker-compose.yml logs nginx    > dast-results/nginx.log    2>&1 || true

      - name: Upload integration reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-reports
          path: |
            dast-results/
            stress-results/
          retention-days: 30

      - name: Tear down
        if: always()
        run: docker compose -f webapp/docker-compose.yml down -v --remove-orphans

  # ── 9. Image Scan — Trivy ─────────────────────────────────────────────────
  image-scan:
    name: Image Scan — Trivy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Downcase repository name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.REPO_LOWER }}/backend:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend
