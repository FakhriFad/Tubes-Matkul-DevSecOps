# ============================================================
# DAST Pipeline — Dynamic Application Security Testing
#
# Uses OWASP ZAP (Zed Attack Proxy) to actively probe the
# running application for vulnerabilities.
#
# Triggers:
#   - After CI passes on main/develop (workflow_run)
#   - Manually via workflow_dispatch
#   - Nightly schedule (keeps catching new vulns over time)
#
# What ZAP tests for:
#   - Injection flaws (SQLi, XSS, command injection)
#   - Broken authentication / session management
#   - Security misconfigurations
#   - Sensitive data exposure
#   - Insecure direct object references
#   - Missing security headers
#   - CSRF vulnerabilities
# ============================================================

name: DAST — OWASP ZAP

on:
  workflow_run:
    workflows: ["CI — Lint · Test · SAST · Build · DAST"]
    branches: [main, develop]
    types: [completed]
  workflow_dispatch:
    inputs:
      zap_rules_file:
        description: "ZAP rules file to use (default: webapp/zap/rules.tsv)"
        required: false
        default: "webapp/zap/rules.tsv"

permissions:
  contents: read
  security-events: write
  issues: write

jobs:

  dast-zap:
    name: DAST — OWASP ZAP Full Scan
    runs-on: ubuntu-latest
    # Only run DAST if the triggering CI workflow succeeded
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4

      # ── 1. Prepare test environment secrets ─────────────────────────────────
      - name: Create .env for DAST environment
        run: |
          cat > webapp/.env << 'EOF'
          POSTGRES_DB=ecommerce_dast
          POSTGRES_USER=ecom_user
          POSTGRES_PASSWORD=dast_test_password_not_prod
          REDIS_PASSWORD=dast_redis_password_not_prod
          JWT_SECRET=dast_jwt_secret_64chars_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          ADMIN_EMAIL=dast-admin@shop.ci
          ADMIN_PASSWORD=DastAdminPass@12345
          CORS_ORIGIN=https://localhost
          NEXT_PUBLIC_API_URL=https://localhost/api
          LOG_LEVEL=warn
          BRUTE_MAX_ATTEMPTS=50
          EOF

      # ── 2. Generate self-signed TLS cert ────────────────────────────────────
      - name: Generate TLS certificate
        run: chmod +x webapp/nginx/generate-certs.sh && ./webapp/nginx/generate-certs.sh

      # ── 3. Start all services ────────────────────────────────────────────────
      - name: Start application stack
        run: |
          docker compose -f webapp/docker-compose.yml up -d --build
          echo "Waiting for services to be healthy..."

      - name: Wait for healthy stack
        run: |
          for i in $(seq 1 24); do
            HEALTHY=$(docker compose -f webapp/docker-compose.yml ps --format json | python3 -c "
          import sys, json
          data = [json.loads(l) for l in sys.stdin if l.strip()]
          print(sum(1 for s in data if s.get('Health') == 'healthy'))
          " 2>/dev/null || echo 0)
            echo "Healthy services: $HEALTHY / 5 (attempt $i/24)"
            [ "$HEALTHY" -ge 4 ] && echo "Stack ready" && break
            sleep 5
          done

      # ── 4. Seed test data ────────────────────────────────────────────────────
      - name: Seed DAST test data
        run: |
          # Register a test customer account via the public Nginx gateway proxy
          curl -sk -X POST https://localhost/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"dast-test@example.com","password":"DastTest@123","full_name":"DAST Tester"}' \
            > /tmp/register-response.json || true

          echo "Register response:"
          cat /tmp/register-response.json
          echo ""

          # Login via public gateway to harvest the active JWT session profile token
          LOGIN_RESP=$(curl -sk -X POST https://localhost/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"dast-test@example.com","password":"DastTest@123"}')

          echo "$LOGIN_RESP" > /tmp/login-response.json
          TOKEN=$(echo "$LOGIN_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('token',''))" 2>/dev/null || echo "")

          if [ -z "$TOKEN" ]; then
            echo "WARNING: Could not obtain auth token — DAST will run unauthenticated only"
          else
            echo "DAST_TOKEN=$TOKEN" >> $GITHUB_ENV
            echo "Got auth token for authenticated scan"
          fi
      # ── 5. ZAP context file (authenticated scan) ─────────────────────────────
      - name: Create ZAP authentication context
        run: |
          mkdir -p webapp/zap
          cat > webapp/zap/ecomshop.context << CTXEOF
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <configuration>
            <context>
              <name>EcomShop</name>
              <desc>EcomShop DAST context</desc>
              <inscope>true</inscope>
              <incregexes>https://localhost.*</incregexes>
            </context>
          </configuration>
          CTXEOF

      - name: Fix workspace permissions for ZAP container
        run: chmod -R 777 ${{ github.workspace }}

      # ── 6. ZAP Baseline Scan (fast, passive + active) ────────────────────────
      - name: Run ZAP Baseline Scan
        continue-on-error: true
        run: |
          docker run --rm -v ${{ github.workspace }}:/zap/wrk/:rw --network=host \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t https://localhost \
            -J report_json.json \
            -w report_md.md \
            -r report_html.html \
            -I -s \
            -c webapp/zap/rules.tsv \
            -z "-config network.connection.timeoutInSecs=30"

      # ── 7. ZAP Full Scan (comprehensive active attack) ───────────────────────
      - name: Run ZAP Full Active Scan
        continue-on-error: true
        run: |
          docker run --rm -v ${{ github.workspace }}:/zap/wrk/:rw --network=host \
            ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
            -t https://localhost \
            -J report_json.json \
            -w report_md.md \
            -r report_html.html \
            -x report_xml.xml \
            -I -s \
            -c webapp/zap/rules.tsv \
            -z "-config network.connection.timeoutInSecs=30"

      # ── 7.5 Convert ZAP XML to GitHub SARIF Format ───────────────────────────
      - name: Convert ZAP XML report to SARIF format
        if: always()
        run: |
          if [ -f "report_xml.xml" ]; then
            echo "Compiling SARIF profile from DAST metrics..."
            npm install xml2js
            node -e "
            const fs = require('fs');
            const xml2js = require('xml2js');
            const parser = new xml2js.Parser();
            
            fs.readFile('report_xml.xml', (err, data) => {
              if (err) { console.error(err); process.exit(1); }
              parser.parseString(data, (err, result) => {
                if (err) { console.error(err); process.exit(1); }
                
                const sarif = {
                  \$schema: 'https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemes/sarif-schema-2.1.0.json',
                  version: '2.1.0',
                  runs: [{
                    tool: { driver: { name: 'OWASP ZAP', version: 'Stable' } },
                    results: []
                  }]
                };
                
                const site = result.OWASPZAPReport.site;
                if (site) {
                  site.forEach(s => {
                    if (s.alerts && s.alerts[0] && s.alerts[0].alertitem) {
                      s.alerts[0].alertitem.forEach(item => {
                        let rawUri = item.uri ? item.uri[0] : 'webapp';
                        let cleanUri = rawUri.replace(/^https?:\/\/[^\/]+\/?/, '');
                        if (!cleanUri || cleanUri === '') { cleanUri = 'webapp/README.md'; }
                        else { cleanUri = 'webapp/' + cleanUri; }

                        // FIX: Extract ZAP risk code and map to GitHub native alert level
                        // ZAP Risk Codes: 3 = High, 2 = Medium, 1 = Low, 0 = Info
                        const riskCode = item.riskcode ? item.riskcode[0] : '1';
                        let githubLevel = 'warning';
                        if (riskCode === '3' || riskCode === '2') {
                          githubLevel = 'error'; // <── Maps to High/Critical in GitHub Security Tab
                        } else if (riskCode === '0') {
                          githubLevel = 'note';
                        }

                        sarif.runs[0].results.push({
                          ruleId: item.pluginid ? item.pluginid[0] : 'zap-alert',
                          level: githubLevel, // <── Tells GitHub's UI how to render the severity badge
                          message: { text: item.alert[0] + ' - ' + (item.desc ? item.desc[0].replace(/<[^>]*>/g, '') : '') },
                          locations: [{
                            physicalLocation: {
                              artifactLocation: { uri: cleanUri }
                            }
                          }]
                        });
                      });
                    }
                  });
                }
                fs.writeFileSync('zap.sarif', JSON.stringify(sarif, null, 2));
                console.log('SARIF file written successfully to zap.sarif');
              });
            });
            "
          else
            echo "WARNING: report_xml.xml not found. Generating minimal placeholder SARIF."
            echo '{"$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemes/sarif-schema-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"OWASP ZAP","version":"Stable"}},"results":[]}]}' > zap.sarif
          fi

      # ── 8. ZAP API Scan (OpenAPI / REST endpoints) ───────────────────────────
      - name: Run ZAP API Scan
        continue-on-error: true
        run: |
          docker run --rm -v ${{ github.workspace }}:/zap/wrk/:rw --network=host \
            ghcr.io/zaproxy/zaproxy:stable zap-api-scan.py \
            -t https://localhost/api \
            -f openapi \
            -I \
            -z "-config network.connection.timeoutInSecs=30"

      # ── 9. Upload ZAP results ─────────────────────────────────────────────────
      - name: Upload ZAP SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: zap.sarif
          category: zap-dast
        continue-on-error: true

      - name: Upload all ZAP reports as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-reports-${{ github.run_number }}
          path: |
            zap.sarif
            report_html.html
            report_json.json
            report_md.md
          retention-days: 30

      # ── 10. Parse ZAP results and fail on HIGH/CRITICAL ───────────────────────
      - name: Evaluate ZAP results
        if: always()
        run: |
          if [ -f "report_json.json" ]; then
            HIGH=$(python3 -c "
          import json, sys
          try:
              data = json.load(open('report_json.json'))
              sites = data.get('site', [])
              highs = sum(
                  len([a for a in s.get('alerts', []) if a.get('riskcode') in ['3','2']])
                  for s in (sites if isinstance(sites, list) else [sites])
              )
              print(highs)
          except Exception as e:
              print('0')
            ")
            echo "High/Critical ZAP findings: $HIGH"
            if [ "$HIGH" -gt "0" ]; then
              echo "::warning::ZAP found $HIGH HIGH or CRITICAL vulnerabilities. Review the Security tab."
            fi
          else
            echo "ZAP result file not found — check ZAP step logs"
          fi

      # ── 11. Collect Docker logs on failure ───────────────────────────────────
      - name: Collect service logs on failure
        if: failure()
        run: |
          echo "=== BACKEND LOGS ===" && docker compose -f webapp/docker-compose.yml logs --tail=100 backend
          echo "=== NGINX LOGS ==="   && docker compose -f webapp/docker-compose.yml logs --tail=50  nginx
          echo "=== FRONTEND LOGS ===" && docker compose -f webapp/docker-compose.yml logs --tail=50 frontend

      # ── 12. Tear down ─────────────────────────────────────────────────────────
      - name: Tear down stack
        if: always()
        run: docker compose -f webapp/docker-compose.yml down -v --remove-orphans
