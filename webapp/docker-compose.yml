# ============================================================
# EcomShop – Docker Compose
#
# Services (each in its own container for independent scaling):
#   nginx     – HTTPS reverse proxy / TLS termination
#   frontend  – Next.js SSR
#   backend   – Node.js + Express API
#   postgres  – PostgreSQL database
#   redis     – Redis cache / session blacklist
#
# Scale examples:
#   docker compose up --scale backend=3
#   docker compose up --scale frontend=2
# ============================================================

networks:
  public_net:    # nginx ↔ frontend, nginx ↔ backend
  backend_net:   # backend ↔ postgres, backend ↔ redis

volumes:
  postgres_data:
  redis_data:
  waf_logs:

services:

  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ecom_postgres
    restart: unless-stopped
    networks:
      - backend_net
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER:     ${POSTGRES_USER:-ecom_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecom_user} -d ${POSTGRES_DB:-ecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ecom_redis
    restart: unless-stopped
    networks:
      - backend_net
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      # Use REDIS_PASSWORD env var inside the container to avoid
      # exposing the password in the process list via -a flag.
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

  # ── Backend (Node.js + Express) ────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # container_name omitted intentionally – allows --scale backend=N
    restart: unless-stopped
    networks:
      - public_net
      - backend_net
    environment:
      NODE_ENV:          production
      PORT:              4000
      POSTGRES_HOST:     postgres
      POSTGRES_PORT:     5432
      POSTGRES_DB:       ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER:     ${POSTGRES_USER:-ecom_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      REDIS_HOST:        redis
      REDIS_PORT:        6379
      REDIS_PASSWORD:    ${REDIS_PASSWORD:?}
      JWT_SECRET:        ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGIN:       ${CORS_ORIGIN:-https://localhost}
      LOG_LEVEL:         ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Frontend (Next.js) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://localhost/api}
    # container_name omitted – allows --scale frontend=N
    restart: unless-stopped
    networks:
      - public_net
    environment:
      NODE_ENV:            production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://localhost/api}
      # Override Docker's container-ID hostname so Next.js binds on 0.0.0.0
      HOSTNAME:            "0.0.0.0"
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Nginx (HTTPS reverse proxy) ────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: ecom_nginx
    restart: unless-stopped
    networks:
      - public_net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      # Probe the backend health endpoint directly via internal network,
      # bypassing the TLS termination that would require -k flag.
      test: ["CMD-SHELL", "wget -qO- http://backend:4000/health | grep -q status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
