# ============================================================
# Jenkins CI Server — Docker Compose
#
# Runs Jenkins with Docker-in-Docker capability so it can
# build and run containers as part of the pipeline.
#
# Start:  docker compose -f jenkins/docker-compose.jenkins.yml up -d
# UI:     http://localhost:8080
# ============================================================

services:

  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: ecom_jenkins
    restart: unless-stopped
    privileged: true          # required for Docker-in-Docker
    user: root
    ports:
      - "8080:8080"           # Jenkins UI
      - "50000:50000"         # Jenkins agent port
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # share host Docker socket
      - /usr/bin/docker:/usr/bin/docker             # share Docker binary
    environment:
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dpermissive-script-security.enabled=true
      JENKINS_OPTS: "--httpPort=8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Jenkins Configuration-as-Code (JCasC) setup
  jenkins-setup:
    image: jenkins/jenkins:lts-jdk21
    container_name: ecom_jenkins_setup
    depends_on:
      jenkins:
        condition: service_healthy
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./jenkins/init.groovy.d:/var/jenkins_home/init.groovy.d
    command: >
      sh -c "echo 'Jenkins ready — configure via http://localhost:8080'"
    restart: "no"

volumes:
  jenkins_home:
