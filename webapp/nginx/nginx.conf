# ============================================================
# Nginx – HTTPS reverse proxy
# Terminates TLS, routes /api/* → backend, /* → frontend
# ============================================================

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ── Logging ──────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # ── Performance ───────────────────────────────────────────
  sendfile          on;
  tcp_nopush        on;
  tcp_nodelay       on;
  keepalive_timeout 65;

  gzip on;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/xml+rss
    image/svg+xml;

  # ── Security headers ─────────────────────────────────────
  add_header X-Frame-Options           "SAMEORIGIN"           always;
  add_header X-Content-Type-Options    "nosniff"              always;
  add_header X-XSS-Protection          "1; mode=block"        always;
  add_header Referrer-Policy           "strict-origin"        always;
  add_header Permissions-Policy        "geolocation=(), camera=()" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  # Content-Security-Policy — prevents XSS by controlling allowed content sources
  add_header Content-Security-Policy "default-src 'self'; script-src  'self' 'unsafe-inline' 'unsafe-eval'; style-src   'self' 'unsafe-inline' https://fonts.googleapis.com; font-src    'self' https://fonts.gstatic.com; img-src     'self' data: https:; connect-src 'self'; frame-ancestors 'none'" always;

  # ── Rate limiting zones ───────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m  rate=5r/m;

  # ── Docker embedded DNS resolver ─────────────────────────
  # 127.0.0.11 is Docker's internal DNS server. valid=10s causes nginx to
  # re-resolve upstream hostnames periodically so newly scaled replicas
  # (docker compose up --scale backend=3) are picked up automatically.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # ── Upstream definitions ──────────────────────────────────
  upstream backend {
    server backend:4000;
    keepalive 32;
  }

  upstream frontend {
    server frontend:3000;
    keepalive 32;
  }

  # ── HTTP → HTTPS redirect ─────────────────────────────────
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # ── Main HTTPS server ─────────────────────────────────────
  server {
    listen 443 ssl;
    http2  on;          # nginx 1.26+ syntax (replaces "listen ... http2")
    server_name localhost;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              off;

    client_max_body_size 10m;

    # ── Auth routes (/api/auth/ before /api/ — longest prefix wins) ──
    location /api/auth/ {
      limit_req zone=auth burst=10 nodelay;

      proxy_pass            http://backend;
      proxy_http_version    1.1;
      proxy_set_header      Connection        "";
      proxy_set_header      Host              $host;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto https;

      proxy_connect_timeout 5s;
      proxy_read_timeout    15s;
    }

    # ── General API routes ────────────────────────────────
    location /api/ {
      limit_req zone=api burst=40 nodelay;

      proxy_pass            http://backend;
      proxy_http_version    1.1;
      proxy_set_header      Connection        "";
      proxy_set_header      Host              $host;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto https;

      proxy_connect_timeout 5s;
      proxy_read_timeout    30s;
    }

    # ── Health check (public, not rate-limited) ───────────
    location /health {
      proxy_pass http://backend/health;
      access_log off;
    }


    # ── Nginx stub_status (for prometheus nginx-exporter) ─────
    location /stub_status {
      stub_status;
      allow 172.0.0.0/8;   # Docker networks only
      deny  all;
      access_log off;
    }

    # ── Frontend (catch-all) ──────────────────────────────
    location / {
      proxy_pass            http://frontend;
      proxy_http_version    1.1;
      proxy_set_header      Upgrade           $http_upgrade;
      proxy_set_header      Connection        "upgrade";
      proxy_set_header      Host              $host;
      proxy_set_header      X-Forwarded-Proto https;
      proxy_read_timeout    60s;
    }
  }
}
