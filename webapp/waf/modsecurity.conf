# ============================================================
# ModSecurity Configuration — EcomShop WAF
# Based on OWASP ModSecurity Core Rule Set (CRS)
# ============================================================

# Enable ModSecurity engine
SecRuleEngine On

# Enable request body inspection (detect SQLi / XSS in POST bodies)
SecRequestBodyAccess On
SecRequestBodyLimit 10485760
SecRequestBodyNoFilesLimit 524288
SecRequestBodyLimitAction Reject

# Enable response body inspection (detect data leaks)
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html application/json
SecResponseBodyLimit 524288
SecResponseBodyLimitAction ProcessPartial

# Audit log — log all blocked requests
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLog /var/log/modsec/audit.log
SecAuditLogFormat JSON
SecAuditLogParts ABIJDEFHZ

# Debug log (set to 0 in production, 3-5 for debugging)
SecDebugLogLevel 0

# Default action: block and return 403
SecDefaultAction "phase:2,deny,status:403,log,auditlog"

# ── Request header rules ──────────────────────────────────────────────────────

# Reject requests with no User-Agent (typical scanner behaviour)
SecRule REQUEST_HEADERS:User-Agent "@rx ^$" \
  "id:9001,phase:1,deny,status:400,log,msg:'Empty User-Agent rejected'"

# Reject suspiciously large Content-Length (DoS prevention)
SecRule REQUEST_HEADERS:Content-Length "@gt 10485760" \
  "id:9002,phase:1,deny,status:413,log,msg:'Request body too large'"

# ── IP-based DoS protection ───────────────────────────────────────────────────

# Track request rate per IP (supplement nginx rate limiting)
SecAction \
  "id:9010,phase:1,nolog,pass,\
  initcol:ip=%{REMOTE_ADDR},\
  setvar:ip.request_count=+1,\
  expirevar:ip.request_count=60"

SecRule IP:REQUEST_COUNT "@gt 300" \
  "id:9011,phase:1,deny,status:429,log,msg:'DoS: too many requests from IP'"

# ── OWASP CRS Tuning for EcomShop ────────────────────────────────────────────

# Increase paranoia level (1=relaxed, 2=moderate, 3=strict, 4=paranoid)
SecAction \
  "id:9020,phase:1,nolog,pass,\
  setvar:tx.paranoia_level=2"

# Detection-only mode for new rules until validated (remove to enforce)
# SecRuleEngine DetectionOnly

# ── Application-specific allowlist ───────────────────────────────────────────

# Allow JWT Bearer tokens in Authorization header (CRS may flag base64 strings)
SecRuleUpdateTargetById 942100 "!REQUEST_HEADERS:Authorization"
SecRuleUpdateTargetById 942440 "!REQUEST_HEADERS:Authorization"

# Allow bcrypt hash patterns in JSON responses
SecRuleUpdateTargetById 942100 "!RESPONSE_BODY"

# ── Geo-blocking (optional — uncomment and configure) ────────────────────────
# SecGeoLookupDb /etc/modsecurity/GeoLite2-Country.mmdb
# SecRule GEO:COUNTRY_CODE "!@within US,ID,SG,MY" \
#   "id:9030,phase:1,deny,status:403,log,msg:'Request from blocked country'"
